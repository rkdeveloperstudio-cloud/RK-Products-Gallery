
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, minimum-scale=1.0,
               user-scalable=no">

    <meta name="theme-color"
          content="#e9eef3">

    <title>Add Product</title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- =====================================================
         PAGE CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="Add.css">



<link
    rel="manifest"
    href="./manifest.webmanifest"
>
<meta
    name="theme-color"
    content="#e9eef3"
>
<meta
    name="mobile-web-app-capable"
    content="yes"
>
<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>
<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>



</head>


<body>


    <div class="page-container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="page-header">

            <button
                class="back-button"
                type="button"
                onclick="goHome()"
                aria-label="Go back to home"
            >
                ←
            </button>


            <div>

                <h1>
                    Add Product
                </h1>

                <p>
                    New product
                </p>

            </div>

        </header>



        <!-- =================================================
             MAIN
        ================================================== -->

        <main>


            <!-- =================================================
                 PRODUCT IMAGE
            ================================================== -->

            <section class="section">

                <div class="section-title">

                    <span>
                        PRODUCT IMAGE
                    </span>

                    <h2>
                        Product photo
                    </h2>

                </div>


                <!-- IMAGE PREVIEW -->

                <div
                    id="imagePreview"
                    class="image-preview"
                >

                    <div class="empty-image">

                        <div class="image-icon">
                            +
                        </div>

                        <p>
                            No image selected
                        </p>

                    </div>

                </div>


                <!-- IMAGE BUTTONS -->

                <div class="image-buttons">


                    <!-- CAMERA -->

                    <button
                        type="button"
                        onclick="openCamera()"
                    >

                        <span>
                            ◉
                        </span>

                        Camera

                    </button>


                    <!-- GALLERY -->

                    <button
                        type="button"
                        onclick="openGallery()"
                    >

                        <span>
                            ▧
                        </span>

                        Gallery

                    </button>

                </div>


                <!-- CAMERA INPUT -->

                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                    hidden
                >


                <!-- GALLERY INPUT -->

                <input
                    type="file"
                    id="galleryInput"
                    accept="image/*"
                    hidden
                >

            </section>



            <!-- =================================================
                 PRODUCT INFORMATION
            ================================================== -->

            <section class="section">


                <div class="section-title">

                    <span>
                        PRODUCT INFORMATION
                    </span>

                    <h2>
                        Details
                    </h2>

                </div>



                <!-- =================================================
                     STYLE NUMBER
                ================================================== -->

                <div class="form-group">

                    <label for="styleNumber">

                        Style Number

                        <small>
                            Optional
                        </small>

                    </label>


                    <input
                        type="text"
                        id="styleNumber"
                        placeholder="Enter style number"
                        autocomplete="off"
                    >

                </div>



                <!-- =================================================
                     BARCODE
                ================================================== -->

                <div class="form-group">

                    <label for="barcode">

                        Barcode

                        <small class="required">
                            Required
                        </small>

                    </label>


                    <div class="barcode-input">

    <input
        type="text"
        id="barcode"
        placeholder="Enter barcode"
        inputmode="numeric"
        autocomplete="off"
        spellcheck="false"
    >

    <button
        type="button"
        onclick="scanBarcode()"
        aria-label="Scan barcode"
    >
        📷
    </button>

</div>

                </div>



                <!-- =================================================
                     PRICE
                ================================================== -->

                <div class="form-group">

                    <label for="price">

                        Price

                        <small>
                            Optional
                        </small>

                    </label>


                    <div class="price-input">

                        <span>
                            AED
                        </span>

                        <input
                            type="number"
                            id="price"
                            placeholder="0.00"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                        >

                    </div>

                </div>

            </section>



            <!-- =================================================
                 SAVE BUTTON
            ================================================== -->

            <button
                id="saveButton"
                class="save-button"
                type="button"
                onclick="saveProduct()"
            >

                <span>
                    Save Product
                </span>

                <strong>
                    →
                </strong>

            </button>


        </main>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer>
            RK Product Manager
        </footer>


    </div>



    <!-- =====================================================
         MODERN TOAST
    ====================================================== -->

    <div
        id="appToast"
        class="app-toast"
        role="status"
        aria-live="polite"
    >

        <div
            id="toastIcon"
            class="toast-icon"
        >
            ✓
        </div>


        <div class="toast-content">

            <div
                id="toastTitle"
                class="toast-title"
            >
                Success
            </div>


            <div
                id="toastMessage"
                class="toast-message"
            ></div>

        </div>


        <button
            type="button"
            class="toast-close"
            onclick="hideToast()"
            aria-label="Close notification"
        >
            ×
        </button>

    </div>



<!-- =====================================================
     BARCODE SCANNER MODAL
====================================================== -->

<div
    id="barcodeScannerModal"
    class="barcode-scanner-modal"
    hidden>

    <div class="barcode-scanner-card">

        <div class="barcode-scanner-header">

            <div>

                <h2>
                    Scan Barcode
                </h2>

                <p>
                    Place the barcode inside the frame
                </p>

            </div>

            <button
                type="button"
                class="barcode-scanner-close"
                onclick="closeBarcodeScanner()"
                aria-label="Close scanner">

                ×

            </button>

        </div>


        <div class="barcode-camera-area">

            <video
                id="barcodeVideo"
                autoplay
                muted
                playsinline>
            </video>


            <div class="barcode-scan-frame">

                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <div
            id="barcodeScannerStatus"
            class="barcode-scanner-status">

            Starting camera...

        </div>


        <button
            type="button"
            class="barcode-cancel-button"
            onclick="closeBarcodeScanner()">

            Cancel

        </button>

    </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./supabase.js"></script>

<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<script src="./Add.js"></script>




<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(registration => {

                console.log(
                    "[PWA] Service Worker registered:",
                    registration.scope
                );

                registration.update();

            })
            .catch(error => {

                console.error(
                    "[PWA] Service Worker registration failed:",
                    error
                );

            });

    });
}
</script>




</body>

</html>
