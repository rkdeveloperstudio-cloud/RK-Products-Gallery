<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#e9eef3">

    <title>Product List</title>


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="List.css">



<link
    rel="manifest"
    href="./manifest.webmanifest"
>
<meta
    name="theme-color"
    content="#e9eef3"
>
<meta
    name="mobile-web-app-capable"
    content="yes"
>
<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>
<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>



</head>


<body>

    <div class="page-container">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="page-header">

            <button
                class="back-button"
                type="button"
                onclick="goHome()"
                aria-label="Go home">

                ←

            </button>


            <div class="header-text">

                <h1>Product List</h1>

                <p>All products</p>

            </div>


            <button
                class="add-button"
                type="button"
                onclick="goAdd()"
                aria-label="Add product">

                +

            </button>

        </header>



        <!-- =================================================
             SUMMARY
        ================================================== -->

        <section class="summary-card">

            <div>

                <span class="summary-label">
                    TOTAL PRODUCTS
                </span>

                <strong id="productCount">
                    0
                </strong>

            </div>


            <div class="summary-icon"
                 aria-hidden="true">

                □

            </div>

        </section>



        <!-- =================================================
             SEARCH
        ================================================== -->

        <section class="search-section">

            <div class="search-box">

                <span class="search-icon"
                      aria-hidden="true">

                    ⌕

                </span>


                <input
                    type="text"
                    id="listSearch"
                    placeholder="Search barcode or style number"
                    autocomplete="off"
                    spellcheck="false">


                <button
                    id="clearSearch"
                    type="button"
                    onclick="clearSearch()"
                    aria-label="Clear search">

                    ×

                </button>

            </div>

        </section>



        <!-- =================================================
             PRODUCT LIST
        ================================================== -->

        <main>

            <div id="productList"
                 class="product-list">

                <!-- Products inserted by JavaScript -->

            </div>


            <!-- =================================================
                 EMPTY STATE
            ================================================== -->

            <div id="emptyState"
                 class="empty-state"
                 hidden>

                <div class="empty-icon"
                     aria-hidden="true">

                    +

                </div>


                <h2>No products</h2>


                <p>
                    Add your first garment product
                    to see it here.
                </p>


                <button
                    type="button"
                    onclick="goAdd()">

                    Add Product

                </button>

            </div>


            <!-- =================================================
                 NO SEARCH RESULTS
            ================================================== -->

            <div id="noResults"
                 class="no-results"
                 hidden>

                No matching products found.

            </div>

        </main>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer>

            RK Product Manager

        </footer>


    </div>



<!-- =====================================================
     EDIT PRODUCT MODAL
===================================================== -->

<div
    id="editModal"
    class="edit-modal"
    hidden
>

    <div class="edit-modal-backdrop"></div>

    <div
        class="edit-modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="editModalTitle"
    >

        <!-- HEADER -->

        <div class="edit-modal-header">

            <div>
                <span class="edit-modal-label">
                    PRODUCT
                </span>

                <h2 id="editModalTitle">
                    Edit Product
                </h2>
            </div>

            <button
                type="button"
                id="closeEditModal"
                class="edit-close-button"
                aria-label="Close"
            >
                ×
            </button>

        </div>


        <!-- IMAGE -->

        <div class="edit-image-section">

            <div
                id="editImagePreview"
                class="edit-image-preview"
            >

                <div
                    id="editImagePlaceholder"
                    class="edit-image-placeholder"
                >
                    □
                </div>

                <img
                    id="editProductImage"
                    src=""
                    alt="Product image"
                    hidden
                >

            </div>


            <div class="edit-image-buttons">

                <button
                    type="button"
                    id="editCameraButton"
                    class="edit-image-button"
                >
                    <span>⌕</span>
                    Camera
                </button>

                <button
                    type="button"
                    id="editGalleryButton"
                    class="edit-image-button"
                >
                    <span>▣</span>
                    Gallery
                </button>

            </div>

            <input
                type="file"
                id="editCameraInput"
                accept="image/*"
                capture="environment"
                hidden
            >

            <input
                type="file"
                id="editGalleryInput"
                accept="image/*"
                hidden
            >

        </div>


        <!-- FORM -->

        <div class="edit-form">

            <div class="edit-form-group">

                <label for="editStyleNumber">
                    Style Number
                </label>

                <input
                    type="text"
                    id="editStyleNumber"
                    placeholder="Enter style number"
                    autocomplete="off"
                >

            </div>


            <div class="edit-form-group">

                <label for="editBarcode">
                    Barcode
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="editBarcode"
                    placeholder="Enter barcode"
                    autocomplete="off"
                >

            </div>


            <div class="edit-form-group">

                <label for="editPrice">
                    Price
                </label>

                <div class="edit-price-input">

                    <span>AED</span>

                    <input
                        type="number"
                        id="editPrice"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                    >

                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="edit-actions">

            <button
                type="button"
                id="cancelEditButton"
                class="edit-cancel-button"
            >
                Cancel
            </button>

            <button
                type="button"
                id="saveEditButton"
                class="edit-save-button"
            >
                <span>Save Changes</span>
                <strong>✓</strong>
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="listToast"
    class="list-toast"
    role="status"
    aria-live="polite"
>

    <div
        id="listToastIcon"
        class="list-toast-icon"
    >
        ✓
    </div>

    <div class="list-toast-content">

        <div
            id="listToastTitle"
            class="list-toast-title"
        >
            Success
        </div>

        <div
            id="listToastMessage"
            class="list-toast-message"
        ></div>

    </div>

    <button
        type="button"
        class="list-toast-close"
        onclick="hideListToast()"
        aria-label="Close notification"
    >
        ×
    </button>

</div>




    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =====================================================
         YOUR SUPABASE CONFIG
    ====================================================== -->

    <script src="supabase.js"></script>


    <!-- =====================================================
         PAGE JAVASCRIPT
    ====================================================== -->

    <script src="list.js"></script>





<script>
if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .then(registration => {

                console.log(
                    "[PWA] Service Worker registered:",
                    registration.scope
                );

                registration.update();

            })
            .catch(error => {

                console.error(
                    "[PWA] Service Worker registration failed:",
                    error
                );

            });

    });
}
</script>





</body>

</html>
